name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

# Pin rustc to the nix-shell / crane baseline so fmt/clippy do not drift with
# every GitHub Actions “stable” bump. Bump intentionally with the toolchain.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build bins
        run: cargo build -p rbitcoin-node -p rbitcoin-cli
      - name: test
        run: cargo test --workspace

  # Line-coverage gate (100% first-party HTML uncovered-line). Slow; separate job
  # so test/fmt/clippy stay the fast push feedback.
  #
  # `continue-on-error: true` until the HTML line gate is fully green again
  # (repo is mid-catchup on historical uncovered regions). Do not use this as a
  # license to drop coverage on new code — agents still run ./scripts/coverage.sh
  # when practical and must not grow gaps. Flip back to required when green.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-coverage
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.14
      - name: coverage (line gate)
        run: ./scripts/coverage.sh
