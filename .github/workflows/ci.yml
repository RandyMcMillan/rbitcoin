name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

# Pin rustc to the nix-shell / crane baseline so fmt/clippy do not drift with
# every GitHub Actions “stable” bump. Bump intentionally with the toolchain.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build bins
        run: cargo build -p rbitcoin-node -p rbitcoin-cli
      - name: test
        run: cargo test --workspace

  # Line-coverage gate (≥90% first-party LCOV LH/LF). Slow; separate job so
  # test/fmt/clippy stay the fast push feedback. Required for merge.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-coverage
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.14
      - name: coverage (line gate)
        run: ./scripts/coverage.sh
