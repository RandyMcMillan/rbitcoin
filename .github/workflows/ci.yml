name: ci

on:
  push:
    branches: [master, main, "v*.*.x", "*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

# Pin rustc to the nix-shell / crane baseline so fmt/clippy do not drift with
# every GitHub Actions “stable” bump. Bump intentionally with the toolchain.
#
# Jobs are split so each gate is its own required check on the PR/push UI:
#   fmt + deny + clippy + ast-grep + test + nixos-module-eval + windows + macos in parallel;
#   coverage waits for fmt/clippy/test.
# Operator binaries are GitHub Releases (release.yml), not this workflow.
#
# GitHub App often cannot push this file; operator `git push` if the branch
# includes workflow YAML.
jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      # Prebuilt cargo-deny — do not cargo install. Pin Action commit (CodeQL).
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          # 0.18.x cannot parse rustsec CVSS 4.0 advisories (2026).
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Structural lints (Q-51). fmt-class: no rustc. Required.
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not in taiki-e TOOLS.md; install-action falls back to cargo-binstall
      # (GitHub Release prebuilt). Do not cargo install.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: ast-grep@0.45.1
      - name: ast-grep fixture self-test
        env:
          CI: "true"
        run: ./scripts/ast-grep.test.sh
      - name: ast-grep scan crates
        run: ./scripts/ast-grep.sh

  clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-clippy
          workspaces: ". -> target/dev"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep uninstrumented artifacts out of the coverage tree (and vice versa).
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
      - name: build bins
        run: cargo build -p rbitcoin-node -p rbitcoin-cli
      - name: stage-musl-artifacts self-test
        run: ./scripts/stage-musl-artifacts.test.sh
      - name: stage-native-artifacts self-test
        run: ./scripts/stage-native-artifacts.test.sh
      - name: fuzz-run self-test
        run: ./scripts/fuzz-run.test.sh
      - name: release-pin self-test
        run: ./scripts/core-functional/release_pin.test.sh
      - name: fetch-bitcoind self-test
        run: ./scripts/core-functional/fetch-bitcoind.test.sh
      - name: miri-run self-test
        run: ./scripts/miri.test.sh
      - name: coverage self-test
        run: ./scripts/coverage.test.sh
      - name: coverage-crap self-test
        run: ./scripts/coverage-crap.test.sh
      - name: release self-test
        run: ./scripts/release.test.sh
      - name: release-gate
        run: ./scripts/release-gate.sh
      - name: os-smoke self-test
        run: ./scripts/ci-os-smoke.test.sh
      - name: pr-checks-watch self-test
        run: ./scripts/pr-checks-watch.test.sh
      - name: cargo test
        run: cargo test --workspace

  nixos-module-eval:
    name: nixos-module-eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nixos-module-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nixos-module-eval-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - name: Evaluate NixOS module
        run: timeout 2m nix build .#checks.x86_64-linux.nixos-module-eval --no-link

  # Windows IOCP store + mmap fuse + query confirm + --smoke. Required. Not a CRT-static snapshot.
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Darwin pool IO + mmap fuse + query confirm + --smoke. Required. Not a notarized / operator zip.
  macos:
    name: macos
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-macos
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Line-coverage 92% floor + CRAP --fail-above 30 (allowlist in .cargo-crap.toml).
  # Slow; waits for the fast gates so a red fmt/clippy/test does not start
  # this job. Required. Job+step timeouts so a hung llvm-cov test binary
  # cannot sit until the runner's 6h default.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, clippy, test]
    env:
      # coverage.sh also forces target/cov; set here so rust-cache keys match.
      CARGO_TARGET_DIR: target/cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-coverage
          workspaces: ". -> target/cov"
      # Prebuilt binary — do not `cargo install` (compiles llvm-cov from crates.io).
      # Pin commit (CodeQL: unpinned 3rd-party Action tags are not immutable).
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-crap@0.4.3
      - name: coverage (line gate)
        timeout-minutes: 15
        env:
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crap-report
          path: coverage/crap.json
          if-no-files-found: ignore
          retention-days: 5

  # Not a required check. Write token only on green master coverage.
  coverage-badge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: coverage
      - name: publish coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_COVERAGE_BADGE: "1"
        run: ./scripts/publish-coverage-badge.sh
