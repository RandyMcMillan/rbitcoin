[package]
name = "rbitcoin-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Block and transaction validation / confirmability"

[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-log = { workspace = true }
bitcoin = { workspace = true }
bitcoin_hashes = { workspace = true }
# Global thread pool for script checks — avoid spawn/teardown per block.
rayon = "1.10"
# Confirm-thread majflt sampling (getrusage RUSAGE_THREAD).
libc = "0.2"

[[bench]]
name = "script_pool"
harness = false

[[bench]]
name = "script_verify"
harness = false

[[bench]]
name = "confirm_waste"
harness = false

[[bench]]
name = "script_hotpath"
harness = false

[[bench]]
name = "script_parallel"
harness = false

[[bench]]
name = "script_parallel_ab"
harness = false

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "script_parallel_focus"
harness = false

[[bench]]
name = "rayon_audit"
harness = false
