[package]
name = "rbitcoin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mmap relational archive store (libbitcoin-class)"

[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
memmap2 = { workspace = true }
# rust-bitcoin ecosystem (hashes only — not full bitcoin types in this crate)
bitcoin_hashes = { workspace = true }
# fallocate / punch-hole for multi‑GiB grows without zero-fill storms (Linux).
libc = "0.2"
# Bulk pread submission for head-resolve / confirm body load (Linux).
io-uring = "0.7"
# Datadir store.secret CSPRNG.
getrandom = "0.2"
# Sealed segment binary fuse8 (~9 bits/key).
xorf = { workspace = true }
bincode = { workspace = true }

[[bench]]
name = "spend_batch"
harness = false

[lints]
workspace = true
