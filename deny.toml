# Supply-chain gate (Q-20). CI: `cargo deny check`.
# Exceptions need a one-line reason in this file.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is unmaintained but stable; transitive via uniffi which we need for Swift FFI" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but stable; transitive via uniffi which we need for Swift FFI" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",           # rust-bitcoin / hashes
    "MITNFA",            # hex_lit via bitcoin 0.32
    "BSL-1.0",
    "OpenSSL",           # ring / rustls stack
    "CDLA-Permissive-2.0",
    "MPL-2.0",             # uniffi (Swift FFI bridge)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
