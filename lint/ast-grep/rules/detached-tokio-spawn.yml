id: detached-tokio-spawn
language: rust
severity: error
message: Discarded tokio::spawn leaks a task; bind, JoinSet, or abort the JoinHandle.
note: Allowed drops — msg_decode spawn_decode_then_with_err (Q-54), node SIGINT handler, rbitcoin-bench.
rule:
  any:
    - pattern: tokio::spawn($BODY);
    - pattern: let _ = tokio::spawn($BODY);
ignores:
  - "**/*tests*.rs"
  - "**/tests/**"
  - "**/benches/**"
  - "crates/rbitcoin-bench/**"
  - "crates/rbitcoin-net/src/msg_decode.rs"
  - "crates/rbitcoin-node/src/run.rs"
