[package]
name = "rustylib"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "rustylib"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.0", features = [ "cli" ] }
rbitcoin-primitives = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-mempool = { workspace = true }
rbitcoin-net = { workspace = true }
rbitcoin-rpc = { workspace = true }
rbitcoin-electrum = { workspace = true }
rbitcoin-esplora = { workspace = true }
rbitcoin-cli = { workspace = true }
rbitcoin-node = { workspace = true }
rbitcoin-log = { workspace = true }
bitcoin = { workspace = true }
tokio = { workspace = true }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
uniffi = { version = "0.28.0", features = [ "build" ] }
